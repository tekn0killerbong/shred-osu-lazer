[General]
Name: Shred Gold Prototype

[Shred]
// Widths of frets 1..5, same on both strings. One value also accepted.
ColumnWidth: 48,48,48,48,48
ColumnSpacing: 17,17,17,17
NoteHeight: 26
SectionGap: 94
// Centre-to-centre distance; 34 brings the pick diamonds together.
RowGap: 34
// Align lower fret top-left corners below upper fret centres.
// Pick rows mirror the fret stagger.
AlignRows: true
// Used only when AlignRows is false.
RowOffsetBottom: 32.5
FretX: -350
// Direction of note movement. 0=right, +90=up, +180=left, -90=down.
// Top must remain -170..-10 ; bottom 10..170. Fret sides follow automatically.
ScrollAngleTop: -65
// Used only when AlignRows is false; otherwise Top + 180.
ScrollAngleBottom: 115
ScrollLength: 165.53
HaloColour: 255,210,90
HaloRadius: 12
HaloOpacity: 0.75
HaloPulse: 0.12
ColourLight: 255,225,155
// Positive LightPosition moves the light toward incoming notes.
LightPosition: 0
LightLength: 85
LightFadeMs: 180
AnimationFPS: 60
HitExpand: 1.8
HitFadeMs: 260
MissFadeMs: 220
ShakeAmplitude: 6
ShakeMs: 180
ErrorColour: 255,75,85
